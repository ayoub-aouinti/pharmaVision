name: pharmavision

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: pharmavision
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma_dev # développement uniquement
    ports:
      - "127.0.0.1:5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharmavision"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: PharmaVision.Api
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=pharmavision;Username=pharma;Password=pharma_dev
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
    ports:
      - "127.0.0.1:5080:5080"
    depends_on:
      db:
        condition: service_healthy

  simulator:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: PharmaVision.Simulator
    environment:
      Simulator__ApiBaseUrl: http://api:5080
    depends_on:
      - api
    restart: on-failure

  web:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "127.0.0.1:5175:80"
    depends_on:
      - api

volumes:
  pgdata:
